<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YieldVision · Dashboard</title>
<link rel="stylesheet" href="/static/css/style.css?v=2026" />
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="/static/js/app.js?v=2026"></script>
</head>
<body>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const view = renderShell();
  view.innerHTML = `
    <section class="hero">
      <div class="tag"><span class="dot"></span> Crop yield prediction</div>
      <h2>Predict crop yield from weather and soil.</h2>
      <p>Add your crop, weather and soil records — type them in or upload a file.
      YieldVision checks the data, shows the trends, trains a model and predicts yield with a range.</p>
      <div class="btn-row">
        <a class="btn btn-primary" href="entry.html">Type in a record</a>
        <a class="btn" href="upload.html">Upload a file</a>
        <button class="btn btn-ghost" id="go-sample">Load sample data</button>
      </div>
    </section>

    <div class="grid cols-4" id="stats" style="margin-top:16px">
      ${Array(4).fill('<div class="skeleton"></div>').join("")}
    </div>

    <div class="grid cols-2-1" style="margin-top:16px">
      <div class="card">
        <h3 class="card-title">Yield over time</h3>
        <p class="card-sub">Average yield per year</p>
        <div class="chart" id="chart-trend"></div>
      </div>
      <div class="card">
        <h3 class="card-title">Yield by crop</h3>
        <p class="card-sub">Average yield per crop (t/ha)</p>
        <div class="chart sm" id="chart-crops"></div>
      </div>
    </div>

    <div class="grid cols-2" style="margin-top:16px">
      <div class="card">
        <h3 class="card-title">Your progress</h3>
        <p class="card-sub">Steps you have completed</p>
        <div id="pipeline-status"></div>
      </div>
      <div class="card">
        <h3 class="card-title">Next steps</h3>
        <p class="card-sub">Jump straight to a task</p>
        <div class="grid cols-2" id="quick"></div>
      </div>
    </div>
  `;

  async function loadSummary() {
    try {
      const s = await API.get("/api/explorer/summary");
      html("stats", `
        <div class="stat"><div class="label">Records</div><div class="value">${fmt.int(s.rows)}</div><div class="delta">${s.n_crops} crops · ${s.n_regions} regions</div></div>
        <div class="stat"><div class="label">Mean yield</div><div class="value">${fmt.num(s.mean_yield)}<small>t/ha</small></div><div class="delta">median ${fmt.num(s.median_yield)}</div></div>
        <div class="stat"><div class="label">Year range</div><div class="value">${s.year_min}<small>– ${s.year_max}</small></div><div class="delta">${s.year_max - s.year_min + 1} seasons of history</div></div>
        <div class="stat"><div class="label">Coverage</div><div class="value">${s.districts.length}<small>districts</small></div><div class="delta">${s.states.length} states</div></div>
      `);

      const trend = await API.get("/api/explorer/trend");
      drawChart("chart-trend", [
        { x: trend.series.map(r => r.year), y: trend.series.map(r => r.mean_yield), type: "scatter", mode: "lines+markers", name: "Mean yield", line: { width: 3, color: THEME.accent } },
        { x: trend.series.map(r => r.year), y: trend.series.map(r => r.trend_line), type: "scatter", mode: "lines", name: "Trend", line: { dash: "dot", color: THEME.accent2 } },
      ], { margin: { l: 52, r: 20, t: 20, b: 44 }, yaxis: { title: "t/ha" } });

      const crops = await API.get("/api/explorer/crops");
      drawChart("chart-crops", [
        { x: crops.crops.map(c => fmt.title(c.crop)), y: crops.crops.map(c => c.mean_yield), type: "bar",
          marker: { color: crops.crops.map((_, i) => THEME.palette[i % THEME.palette.length]) } },
      ], { margin: { l: 48, r: 16, t: 20, b: 44 }, yaxis: { title: "t/ha" }, showlegend: false });

      await renderPipeline();
      document.getElementById("side-status") && refreshSideStatus();
    } catch (e) {
      html("stats", `<div class="card" style="grid-column:1/-1">
        <div class="empty">${ICONS.empty}<div>No data yet. Type in a record or upload a file to begin.</div></div>
      </div>`);
      ["chart-trend", "chart-crops"].forEach(id => html(id, emptyState("Charts appear once you add data.")));
      html("pipeline-status", emptyState("Add data to see your progress."));
    }
  }

  async function renderPipeline() {
    let models = [];
    try { models = (await API.get("/api/models")).models || []; } catch (_) {}
    const active = models.find(m => m.is_active);
    const steps = [
      { label: "Data added and checked", done: true },
      { label: "Trends ready to view", done: true },
      { label: "Model trained", done: models.length > 0 },
      { label: "Model activated", done: !!active },
      { label: "Predictions and reports", done: !!active },
    ];
    html("pipeline-status", steps.map(s => `
      <div class="kv"><span>${s.label}</span><span>${s.done ? '<span class="badge ok">done</span>' : '<span class="badge mute">pending</span>'}</span></div>
    `).join("") + (active ? `<div class="muted" style="margin-top:10px">Active model: <strong>${modelLabel(active.name)}</strong></div>` : ""));

    html("quick", `
      <a class="btn" href="entry.html">Type in a record</a>
      <a class="btn" href="explorer.html">See trends</a>
      <a class="btn" href="models.html">Train a model</a>
      <a class="btn" href="predict.html">Predict yield</a>
    `);
  }

  document.getElementById("go-sample").addEventListener("click", async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Generating…';
    try {
      const r = await API.post("/api/datasets/sample");
      toast(`Loaded ${fmt.int(r.inserted)} sample records`, "ok");
      await loadSummary();
    } catch (e) {
      toast(e.message, "err");
    } finally {
      btn.disabled = false;
      btn.textContent = "Load sample data";
    }
  });

  loadSummary();
});
</script>
</body>
</html>
