<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YieldVision · Reports & Export</title>
<link rel="stylesheet" href="/static/css/style.css" />
<script src="/static/js/app.js"></script>
</head>
<body>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const view = renderShell();
  const SECTIONS = [
    ["summary", "Dataset summary"],
    ["trends", "Historical trends"],
    ["models", "Models and accuracy"],
    ["explainability", "Explainability"],
    ["predictions", "Predictions"],
  ];

  view.innerHTML = `
    <div class="grid cols-2">
      <div class="card">
        <h3 class="card-title">Generate PDF report</h3>
        <p class="card-sub">A formatted analysis report with figures, metrics and interpretation</p>
        <label class="field"><span>Report title</span><input id="report-title" value="YieldVision Analysis Report" /></label>
        <label class="field"><span>Model</span><select id="report-model"><option value="">Active model</option></select></label>
        <div>${SECTIONS.map(([k, l]) => `<label class="check"><input type="checkbox" class="section" value="${k}" checked /> ${l}</label>`).join("")}</div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn btn-primary" id="generate">Generate report</button>
        </div>
        <div id="report-result" style="margin-top:12px"></div>
      </div>

      <div class="card">
        <h3 class="card-title">Export data</h3>
        <p class="card-sub">Download cleaned data and full results</p>
        <div class="grid" style="gap:10px">
          <a class="btn" href="/api/export/data.csv">Download cleaned data (CSV)</a>
          <a class="btn" href="/api/export/results.xlsx">Download results workbook (Excel)</a>
          <a class="btn btn-ghost" href="/api/template" download>Download CSV template</a>
        </div>
        <div class="card" style="margin-top:16px;background:transparent">
          <h3 class="card-title">Prediction history</h3>
          <div class="btn-row"><button class="btn btn-ghost btn-sm" id="export-history">Load history</button></div>
          <div class="table-wrap" style="margin-top:10px;max-height:300px;overflow:auto"><table class="data" id="history">
            <thead><tr><th>When</th><th>Model</th><th>Yield</th></tr></thead><tbody></tbody>
          </table></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h3 class="card-title">Generated reports</h3>
      <p class="card-sub">Download previous reports</p>
      <div class="table-wrap"><table class="data" id="reports">
        <thead><tr><th>ID</th><th>Created</th><th>File</th><th></th></tr></thead><tbody></tbody>
      </table></div>
    </div>
  `;

  try {
    const models = (await API.get("/api/models")).models;
    const sel = document.getElementById("report-model");
    models.forEach(m => {
      const o = document.createElement("option");
      o.value = m.model_id; o.textContent = `${m.name} (v${m.version})${m.is_active ? " · active" : ""}`;
      sel.appendChild(o);
    });
  } catch (_) {}

  document.getElementById("generate").addEventListener("click", async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Generating…';
    const sections = [...document.querySelectorAll(".section:checked")].map(i => i.value);
    const modelVal = document.getElementById("report-model").value;
    try {
      const r = await API.post("/api/report", {
        title: document.getElementById("report-title").value,
        model_id: modelVal ? Number(modelVal) : null,
        include_sections: sections,
      });
      html("report-result", `<a class="btn btn-primary" href="${r.download_url}" target="_blank">Download report (${r.format.toUpperCase()})</a>`);
      toast("Report generated", "ok");
      loadReports();
    } catch (e) { toast(e.message, "err"); html("report-result", emptyState(e.message)); }
    finally { btn.disabled = false; btn.textContent = "Generate report"; }
  });

  async function loadReports() {
    try {
      const reports = (await API.get("/api/report")).reports;
      document.querySelector("#reports tbody").innerHTML = reports.map(r => `
        <tr><td class="num">${r.report_id}</td><td>${fmt.date(r.created_at)}</td>
        <td class="mono">${(r.file_path || "").split("/").pop()}</td>
        <td><a class="btn btn-sm" href="/api/report/${r.report_id}">Download</a></td></tr>`).join("")
        || `<tr><td colspan="4">${emptyState("No reports generated yet.")}</td></tr>`;
    } catch (_) {}
  }

  document.getElementById("export-history").addEventListener("click", async () => {
    try {
      const h = (await API.get("/api/predict/history?limit=50")).predictions;
      document.querySelector("#history tbody").innerHTML = h.map(p => `
        <tr><td>${fmt.date(p.created_at)}</td><td>#${p.model_id ?? "–"}</td><td class="num">${fmt.num(p.y_pred)}</td></tr>`).join("")
        || `<tr><td colspan="3">${emptyState("No predictions yet.")}</td></tr>`;
    } catch (e) { toast(e.message, "err"); }
  });

  loadReports();
});
</script>
</body>
</html>
